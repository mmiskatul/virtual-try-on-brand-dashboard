name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 26, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
        env:
          NEXT_PUBLIC_BACKEND_API_URL: https://api.vtrystudio.com
          NEXTAUTH_SECRET: ci-only-secret-ci-only-secret-ci-only-secret
